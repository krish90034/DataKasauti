server.port=${PORT:8080}
server.address=0.0.0.0

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=21MB

spring.jackson.property-naming-strategy=SNAKE_CASE

datakasauti.upload.temp-dir=${java.io.tmpdir}/datakasauti
datakasauti.upload.allowed-extensions=csv
datakasauti.upload.max-upload-mb=10
datakasauti.upload.preview-rows=20
datakasauti.upload.max-rows=200000
datakasauti.upload.max-columns=200
datakasauti.upload.stale-file-minutes=60

datakasauti.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}